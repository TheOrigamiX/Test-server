<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoltRush - ทดสอบตัวละครใน Lobby</title>
<style>
  :root {
    --bg-a: #e8f1fb;
    --bg-b: #fdf3d6;
    --panel: rgba(255, 255, 255, 0.92);
    --text: #1b2433;
    --muted: #596478;
    --line: #cfd8e6;
    --accent: #1f5fe0;
    --size: 150px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-a: #0f1a2c;
      --bg-b: #221c38;
      --panel: rgba(27, 36, 52, 0.94);
      --text: #eef2f8;
      --muted: #9aa8bd;
      --line: #35435d;
      --accent: #78a2ff;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
    color: var(--text);
    font-family: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  #stage { position: fixed; inset: 0; }

  /* ตัวละคร: wrapper ขยับตำแหน่ง, body กลับด้าน/เอียง, sprite เด้ง/หายใจ */
  .char {
    position: absolute;
    left: 0; top: 0;
    width: var(--size);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
  }
  .char.dragging { cursor: grabbing; }
  .char.dragging .body { transform-origin: 50% 8%; }

  .body {
    transform-origin: 50% 100%;
    transform: scaleX(var(--dir, 1)) rotate(var(--tilt, 0deg));
    transition: transform 0.12s ease-out;
  }
  .sprite {
    display: block;
    width: 100%;
    height: auto;
    transform-origin: 50% 100%;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .sprite.idle { animation: breathe 2.2s ease-in-out infinite; }
  .sprite.walk { animation: bob 0.44s ease-in-out infinite; }
  .sprite.drag { animation: none; }

  @keyframes breathe { 50% { transform: scaleY(1.04); } }
  @keyframes bob { 50% { transform: translateY(-6px); } }

  .tag {
    margin-top: 2px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  #stage.hide-names .tag { display: none; }

  /* แผงควบคุม */
  #panel {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 20000;
    width: min(620px, calc(100% - 24px));
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 14px;
  }
  #panel h1 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px 4px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:has(input:checked) { border-color: var(--accent); }
  .chip input { margin: 0; accent-color: var(--accent); }
  .chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, 0.35); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
  .row label { display: inline-flex; align-items: center; gap: 8px; }
  .row input[type="range"] { accent-color: var(--accent); width: 140px; }
  .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

  @media (prefers-reduced-motion: reduce) {
    .sprite.idle, .sprite.walk { animation: none; }
    .body { transition: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<aside id="panel">
  <h1>ตัวละครใน Lobby</h1>
  <div id="chips" role="group" aria-label="เลือกตัวละครที่จะแสดง"></div>
  <div class="row">
    <label>ขนาด
      <input type="range" id="size" min="80" max="320" value="150">
      <output id="sizeOut">150</output> px
    </label>
    <label><input type="checkbox" id="names" checked> แสดงชื่อ</label>
  </div>
  <p class="hint">ลากตัวละครได้ ถ้าไม่มีรูปในโฟลเดอร์ images/ จะใช้ตัวแทนสีแทนอัตโนมัติ</p>
</aside>

<script>
/* ---------- ตั้งค่า ---------- */
// โฟลเดอร์รูป: images/<ชื่อ>_<ท่า>.png
//   idle = ยืน, walk1 = ก้าวขา A, walk2 = ก้าวขา B (สลับขา), walk3 = ท่าผ่าน (ไม่บังคับ)
//   drag1 = ห้อยนิ่ง, drag2 = ขาแกว่งไปซ้าย (ใช้ตอนลากไปขวา), drag3 = ขาแกว่งไปขวา (ใช้ตอนลากไปซ้าย)
const IMG_DIR = 'images/';
const ART_FACES = 1;         // รูปท่าเดินหันขวา = 1, หันซ้าย = -1
const WALK_SPEED_RATIO = 0.85; // ความเร็วเดิน = ขนาดตัวละคร x ค่านี้ (พิกเซลต่อวินาที) กันเท้าลื่น
const FRAME_MS = 220;        // สลับเฟรมท่าเดินทุกกี่มิลลิวินาที
const DRAG_LEAN_SPEED = 450; // ความเร็วลาก (px/วินาที) ที่ถือว่าแกว่งสุด
const DRAG_TILT_DEG = 10;    // องศาเอียงสูงสุดตอนแกว่งสุด

const ROSTER = [
  { name: 'mint',    label: 'Mint',    color: '#8fe3c0', on: true  },
  { name: 'latte',   label: 'Latte',   color: '#c9a27c' },
  { name: 'fasai',   label: 'Fasai',   color: '#7cc8f2' },
  { name: 'storm',   label: 'Storm',   color: '#3b5a8c' },
  { name: 'watt',    label: 'Watt',    color: '#ffd23f', on: true  },
  { name: 'sunny',   label: 'Sunny',   color: '#ff9f43', on: true  },
  { name: 'iron',    label: 'Iron',    color: '#8a949e' },
  { name: 'nami',    label: 'Nami',    color: '#4fd1c5' },
  { name: 'nucleia', label: 'Nucleia', color: '#b6ff4d' },
  { name: 'chrono',  label: 'Chrono',  color: '#8e5bd6', on: true  },
  { name: 'aurora',  label: 'Aurora',  color: '#d58cf0' }
];

/* ---------- ตัวช่วย ---------- */
const stage = document.getElementById('stage');
const active = new Map();   // ชื่อ -> ตัวละครที่แสดงอยู่
let curSize = 150;          // ขนาดตัวละครปัจจุบัน (px) ตรงกับ --size
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);

function placeholder(color, frame) {
  // ตัวแทนเมื่อไม่มีรูปจริง: สลับตำแหน่งเท้าเพื่อให้เห็นว่าเดิน
  const l = frame ? 38 : 46, r = frame ? 58 : 50;
  const svg =
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'>" +
    "<ellipse cx='48' cy='90' rx='22' ry='4' fill='rgba(0,0,0,.15)'/>" +
    "<rect x='34' y='52' width='28' height='28' rx='12' fill='" + color + "' stroke='#333' stroke-width='3'/>" +
    "<circle cx='48' cy='34' r='24' fill='" + color + "' stroke='#333' stroke-width='3'/>" +
    "<circle cx='40' cy='36' r='3' fill='#333'/><circle cx='56' cy='36' r='3' fill='#333'/>" +
    "<ellipse cx='" + l + "' cy='84' rx='7' ry='5' fill='#fff' stroke='#333' stroke-width='3'/>" +
    "<ellipse cx='" + r + "' cy='84' rx='7' ry='5' fill='#fff' stroke='#333' stroke-width='3'/>" +
    "</svg>";
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function loadImg(url) {
  return new Promise(resolve => {
    const i = new Image();
    i.onload = () => resolve(url);
    i.onerror = () => resolve(null);
    i.src = url;
  });
}

async function loadSprites(def) {
  const names = ['idle', 'walk1', 'walk2', 'walk3', 'drag1', 'drag2', 'drag3'];
  const [idle, w1, w2, w3, d1, d2, d3] = await Promise.all(
    names.map(k => loadImg(IMG_DIR + def.name + '_' + k + '.png'))
  );
  if (!idle) {
    // ไม่มีรูปยืน: ใช้ตัวแทนทั้งชุด
    const p0 = placeholder(def.color, 0), p1 = placeholder(def.color, 1);
    return { real: false, idle: p0, walk: [p0, p1], drag: { hang: p0, left: p1, right: p1 } };
  }
  // ท่าเดิน: ขา A -> ท่าผ่าน -> ขา B -> ท่าผ่าน (ถ้าไม่มีท่าผ่าน สลับ A/B อย่างเดียว)
  const a = w1 || idle;
  const b = w2 || a;
  const walk = w3 ? [a, w3, b, w3] : [a, b];
  // ท่าลาก: ห้อยนิ่ง / ขาแกว่งซ้าย / ขาแกว่งขวา (ถ้ารูปขาด ใช้ท่าห้อยแทน)
  const hang = d1 || idle;
  const drag = { hang, left: d2 || hang, right: d3 || hang };
  return { real: true, idle, walk, drag };
}

const panel = document.getElementById('panel');
function bounds(c) {
  const w = c.el.offsetWidth || curSize;
  const h = c.el.offsetHeight || curSize * 1.4;
  const reserve = panel.offsetHeight + 24;   // เว้นพื้นที่แผงควบคุมด้านล่าง ตัวละครจะไม่เดินไปซ่อนใต้แผง
  return { w: Math.max(0, innerWidth - w), h: Math.max(0, innerHeight - h - reserve) };
}

function apply(c) {
  c.el.style.transform = 'translate3d(' + c.x.toFixed(1) + 'px,' + c.y.toFixed(1) + 'px,0)';
  c.el.style.zIndex = c.state === 'drag' ? 10000 : Math.round(c.y);
}

function setState(c, s) {
  c.state = s;
  c.img.className = 'sprite ' + s;
  c.frame = 0;
  c.frameT = 0;
  c.img.src = s === 'walk' ? c.sprites.walk[0] : s === 'drag' ? c.sprites.drag.hang : c.sprites.idle;
  if (s === 'drag') { c.dragPose = 'hang'; c.vx = 0; c.lean = 0; c.swayT = 0; }
}

function pickTarget(c) {
  const b = bounds(c);
  c.tx = clamp(c.x + rand(-320, 320), 0, b.w);
  c.ty = clamp(c.y + rand(-200, 200), 0, b.h);
  if (Math.hypot(c.tx - c.x, c.ty - c.y) < 40) { c.timer = 0.4; return; }
  setState(c, 'walk');
}

/* ---------- สร้าง/ลบตัวละคร ---------- */
async function spawn(def) {
  if (active.has(def.name)) return;
  const c = {
    def, ready: false, x: 0, y: 0, tx: 0, ty: 0,
    state: 'idle', timer: rand(0.3, 1.5), frame: 0, frameT: 0,
    dir: 1, tilt: 0, drag: null, sprites: null, el: null, img: null, body: null,
    vx: 0, lean: 0, swayT: 0, dragPose: 'hang', lastMoveT: 0
  };
  active.set(def.name, c);
  c.sprites = await loadSprites(def);
  if (active.get(def.name) !== c) return;   // ถูกปิดระหว่างโหลดรูป

  const el = document.createElement('div');
  el.className = 'char';
  el.innerHTML = '<div class="body"><img class="sprite idle" draggable="false"></div><div class="tag"></div>';
  c.el = el;
  c.body = el.firstChild;
  c.img = c.body.firstChild;
  c.img.alt = def.label;
  c.img.src = c.sprites.idle;
  el.lastChild.textContent = def.label + (c.sprites.real ? '' : ' (ตัวแทน)');
  stage.appendChild(el);

  const b = bounds(c);
  c.x = rand(0, b.w);
  c.y = rand(0, b.h);
  apply(c);

  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    el.setPointerCapture(e.pointerId);
    c.drag = { dx: e.clientX - c.x, dy: e.clientY - c.y };
    el.classList.add('dragging');
    setState(c, 'drag');
    c.lastMoveT = performance.now();
    c.body.style.setProperty('--dir', 1);   // ตอนลากไม่กลับด้าน เพื่อให้เอียงถูกทิศเสมอ
  });
  el.addEventListener('pointermove', e => {
    if (!c.drag) return;
    const bb = bounds(c);
    const nx = clamp(e.clientX - c.drag.dx, 0, bb.w);
    const ny = clamp(e.clientY - c.drag.dy, 0, bb.h);
    const now = performance.now();
    c.vx = (nx - c.x) / (Math.max(1, now - c.lastMoveT) / 1000);   // ความเร็วลากแนวนอน px/วินาที
    c.lastMoveT = now;
    c.x = nx;
    c.y = ny;
    apply(c);
  });
  const release = () => {
    if (!c.drag) return;
    c.drag = null;
    c.tilt = 0;
    c.body.style.setProperty('--tilt', '0deg');
    c.body.style.setProperty('--dir', c.dir);   // คืนทิศเดินเดิม
    el.classList.remove('dragging');
    setState(c, 'idle');
    c.timer = 1.2;
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);

  c.ready = true;
}

function despawn(name) {
  const c = active.get(name);
  if (!c) return;
  if (c.el) c.el.remove();
  active.delete(name);
}

/* ---------- วนลูปเดิน ---------- */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  for (const c of active.values()) {
    if (!c.ready) continue;

    if (c.state === 'idle') {
      c.timer -= dt;
      if (c.timer <= 0) pickTarget(c);
    } else if (c.state === 'walk') {
      const dx = c.tx - c.x, dy = c.ty - c.y;
      const d = Math.hypot(dx, dy);
      const step = curSize * WALK_SPEED_RATIO * dt;
      if (d <= step) {
        c.x = c.tx; c.y = c.ty;
        setState(c, 'idle');
        c.timer = rand(1.2, 3.5);
      } else {
        c.x += dx / d * step;
        c.y += dy / d * step;
        if (Math.abs(dx) > 4) {
          const nd = Math.sign(dx) * ART_FACES;
          if (nd !== c.dir) { c.dir = nd; c.body.style.setProperty('--dir', nd); }
        }
        c.frameT += dt * 1000;
        if (c.frameT >= FRAME_MS) {
          c.frameT = 0;
          c.frame = (c.frame + 1) % c.sprites.walk.length;
          c.img.src = c.sprites.walk[c.frame];
        }
      }
    } else if (c.state === 'drag') {
      c.vx *= Math.exp(-6 * dt);                                      // หยุดลาก ความเร็วค่อยๆ หาย
      const target = clamp(c.vx / DRAG_LEAN_SPEED, -1, 1);
      c.lean += (target - c.lean) * (1 - Math.exp(-dt / 0.10));       // ทำให้แกว่งนุ่ม ไม่กระตุก
      // ลากไปขวา -> ขาแกว่งซ้าย, ลากไปซ้าย -> ขาแกว่งขวา (สวนทางกับการลาก)
      let pose = c.dragPose;
      if (c.lean > 0.25) pose = 'left';
      else if (c.lean < -0.25) pose = 'right';
      else if (Math.abs(c.lean) < 0.1) pose = 'hang';
      if (pose !== c.dragPose) { c.dragPose = pose; c.img.src = c.sprites.drag[pose]; }
      c.swayT += dt;
      const sway = Math.sin(c.swayT * 2.4) * 2.5 * (1 - Math.abs(c.lean));   // ห้อยแล้วแกว่งเบาๆ
      c.tilt = c.lean * DRAG_TILT_DEG + sway;
      c.body.style.setProperty('--tilt', c.tilt.toFixed(1) + 'deg');
    }
    apply(c);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function clampAll() {
  for (const c of active.values()) {
    if (!c.ready) continue;
    const b = bounds(c);
    c.x = clamp(c.x, 0, b.w);
    c.y = clamp(c.y, 0, b.h);
    apply(c);
  }
}
addEventListener('resize', clampAll);

/* ---------- แผงควบคุม ---------- */
const chips = document.getElementById('chips');
for (const def of ROSTER) {
  const label = document.createElement('label');
  label.className = 'chip';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = !!def.on;
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.background = def.color;
  label.append(cb, dot, document.createTextNode(def.label));
  cb.addEventListener('change', () => (cb.checked ? spawn(def) : despawn(def.name)));
  chips.append(label);
  if (def.on) spawn(def);
}

const sizeIn = document.getElementById('size');
const sizeOut = document.getElementById('sizeOut');
sizeIn.addEventListener('input', () => {
  curSize = Number(sizeIn.value);
  document.documentElement.style.setProperty('--size', sizeIn.value + 'px');
  sizeOut.textContent = sizeIn.value;
  clampAll();
});
document.getElementById('names').addEventListener('change', e => {
  stage.classList.toggle('hide-names', !e.target.checked);
});
</script>
</body>
</html>
